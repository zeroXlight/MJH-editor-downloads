<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>梦江湖 · 模型与立绘总表 __VERSION__</title>
<style>
:root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#352d27;background:#f5f0e7}*{box-sizing:border-box}body{margin:0}header{padding:30px max(24px,calc((100vw - 1440px)/2));background:#fcfaf5;border-bottom:1px solid #d9cdbb}h1{font-size:26px;margin:0 0 12px}.hint{color:#77695c;font-size:14px;line-height:1.8;margin:0}main{max-width:1488px;margin:auto;padding:22px 24px}.filters{display:flex;gap:12px;flex-wrap:wrap;position:sticky;top:0;background:#f5f0ef;padding:14px 0;z-index:1}input,select,button{font:inherit;border:1px solid #d7c8b4;border-radius:7px;background:#fffdf9;padding:10px 12px;color:inherit}input{flex:1;min-width:260px}button{cursor:pointer}button:hover{border-color:#a74436}button:disabled{opacity:.45;cursor:default}.summary{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0;color:#77695c}.table{overflow:auto;background:#fffcf6;border:1px solid #dfd3c3;border-radius:10px}table{border-collapse:collapse;width:100%;min-width:900px;text-align:left}th{padding:14px;font-size:13px;color:#766352;background:#eee5d7}td{padding:14px;border-top:1px solid #e9dfd1;font-size:14px;vertical-align:middle}td img{display:block;width:100px;height:136px;object-fit:contain;background:repeating-conic-gradient(#eee9e0 0% 25%,#f8f5ef 0% 50%) 50%/16px 16px;border-radius:5px;cursor:zoom-in}.code{font:700 16px ui-monospace,Consolas,monospace;color:#a63f32;white-space:nowrap}.sub{font-size:12px;color:#837464;line-height:1.7;overflow-wrap:anywhere}.name{font-size:16px;line-height:1.6}.resource{max-width:360px;overflow-wrap:anywhere;line-height:1.8}details{margin-top:5px;font-size:12px;max-width:280px;overflow-wrap:anywhere}summary{cursor:pointer;color:#837464}.copy{padding:5px 8px;margin-top:9px;font-size:12px}.empty{padding:70px;text-align:center;color:#8a7b6c}.pager{display:flex;align-items:center;justify-content:center;gap:14px;padding:20px}dialog{border:1px solid #d7c8b4;border-radius:12px;max-width:680px;width:90vw;background:#fffcf6;color:#352d27}dialog::backdrop{background:#0007}dialog img{display:block;margin:20px auto;width:320px;max-width:90%;height:400px;object-fit:contain;background:#f0e9df}.dialog-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.dialog-info{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.8}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#352d27;color:#fff;padding:10px 18px;border-radius:7px;display:none;z-index:4}
</style>
<header><h1>梦江湖 · 模型与立绘总表</h1><p class="hint">__VERSION__ · 离线查询，无需联网</p><p class="hint">模型编号以 M 开头，立绘编号以 P 开头；复制编号后，在游戏易容窗口对应的“更改模型”或“更改立绘”中输入查询。<br>同一模型的重复配置已合并，仍可查询全部关联模型编号及人物编号。图示为默认姿态或立绘缩略图；点击图片查看详情。当前游戏资源变化后，可从编辑器重新导出总表。</p></header>
<main><div class="filters"><input id="query" placeholder="输入编号、人物名、模型名或资源名，例如 M00006、江灵露、role_wulinmengzhu" aria-label="搜索"><select id="kind" aria-label="资源类型"><option value="">全部类型</option><option value="model">更改模型</option><option value="portrait">更改立绘</option></select><select id="source" aria-label="资源来源"><option value="">全部来源</option><option value="native">原版</option><option value="mobile">手游</option></select><button id="clear">清空搜索</button></div>
<div class="summary"><span id="count"></span><span id="totals"></span><span><button id="prevTop">上一页</button> <span id="pageTop"></span> <button id="nextTop">下一页</button></span></div><div class="table"><table><thead><tr><th>预览</th><th>查询编号</th><th>名称 / 关联人物</th><th>模型 / 贴图 / 立绘资源</th><th>关联编号</th></tr></thead><tbody id="body"></tbody></table><div id="empty" class="empty" hidden>没有匹配的资源，请检查编号或清空搜索。</div></div><div class="pager"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div></main>
<dialog id="detail"><div class="dialog-head"><b id="detailTitle"></b><button id="close">关闭</button></div><img id="detailImage" alt="资源预览"><div id="detailInfo" class="dialog-info"></div></dialog><div id="toast" class="toast">编号已复制</div>
<script id="resources" type="application/json">__ROWS__</script>
<script>
const rows=JSON.parse(document.getElementById('resources').textContent),$=id=>document.getElementById(id),size=48;let page=1,filtered=rows;
function matches(row,query){return query.trim().toLowerCase().split(/\s+/).filter(Boolean).every(token=>{const code=token.match(/^([mp])(\d+)$/),digits=/^\d+$/.test(token);if(code||digits){const number=Number(code?code[2]:token),id=row.query_id.toLowerCase();return Number(id.slice(1))===number&&(!code||id[0]===code[1])||!code&&[...(row.aliases||[]),...(row.role_ids||[])].some(i=>Number(i)===number)}return row.search.toLowerCase().includes(token)})}
function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
async function copy(text){try{await navigator.clipboard.writeText(text)}catch{const t=node('textarea',text);document.body.append(t);t.select();document.execCommand('copy');t.remove()}$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1200)}
function detail(row){$('detailTitle').textContent=row.query_id+' · '+row.label;$('detailImage').src=row.preview;$('detailInfo').textContent=['类型：'+(row.kind==='model'?'模型':'立绘')+' / '+(row.source==='mobile'?'手游':'原版'),'资源：'+row.resource,row.texture?'贴图：'+row.texture:'',row.names.length?'关联人物：'+row.names.join('、'):'',row.aliases.length?'关联模型编号：'+row.aliases.join('、'):'',row.role_ids.length?'关联人物编号：'+row.role_ids.join('、'):''].filter(Boolean).join('\n');$('detail').showModal()}
function render(){const pages=Math.max(1,Math.ceil(filtered.length/size));page=Math.min(page,pages);$('body').replaceChildren();for(const row of filtered.slice((page-1)*size,page*size)){const tr=node('tr'),imageCell=node('td'),image=node('img');image.src=row.preview;image.alt=row.query_id+' '+row.label;image.loading='lazy';image.onclick=()=>detail(row);imageCell.append(image);tr.append(imageCell);const code=node('td');code.append(node('div',row.query_id,'code'),node('div',(row.source==='mobile'?'手游':'原版')+' · '+(row.kind==='model'?'模型':'立绘'),'sub'));const button=node('button','复制编号','copy');button.onclick=()=>copy(row.query_id);code.append(button);tr.append(code);const name=node('td');name.append(node('div',row.label,'name'));if(row.names.length){const d=node('details'),s=node('summary','全部关联人物（'+row.names.length+'）');d.append(s,node('div',row.names.join('、')));name.append(d)}tr.append(name);const resource=node('td',undefined,'resource');resource.append(node('div',row.resource));if(row.texture)resource.append(node('div','贴图：'+row.texture,'sub'));tr.append(resource);const ids=node('td');if(row.aliases.length){ids.append(node('div','模型：'+row.aliases.slice(0,6).join('、'),'sub'));if(row.aliases.length>6){const d=node('details');d.append(node('summary','全部 '+row.aliases.length+' 个模型编号'),node('div',row.aliases.join('、')));ids.append(d)}}if(row.role_ids.length){const d=node('details');d.append(node('summary','人物编号（'+row.role_ids.length+'）'),node('div',row.role_ids.join('、')));ids.append(d)}if(!row.aliases.length&&!row.role_ids.length)ids.append(node('span','使用左侧查询编号','sub'));tr.append(ids);$('body').append(tr)}$('empty').hidden=filtered.length>0;$('count').textContent='找到 '+filtered.length+' 项';$('page').textContent=page+' / '+pages+' 页';for(const id of ['prev','prevTop'])$(id).disabled=page<=1;for(const id of ['next','nextTop'])$(id).disabled=page>=pages;$('pageTop').textContent=$('page').textContent}
function filter(){filtered=rows.filter(row=>(!$('kind').value||row.kind===$('kind').value)&&(!$('source').value||row.source===$('source').value)&&matches(row,$('query').value));page=1;render()}
let timer;$('query').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(filter,140)});$('kind').onchange=filter;$('source').onchange=filter;$('clear').onclick=()=>{$('query').value='';filter();$('query').focus()};$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};$('prevTop').onclick=$('prev').onclick;$('nextTop').onclick=$('next').onclick;$('close').onclick=()=>$('detail').close();$('totals').textContent='模型 '+rows.filter(r=>r.kind==='model').length+' 项 · 立绘 '+rows.filter(r=>r.kind==='portrait').length+' 项';if(!rows.some(r=>r.source==='mobile'))$('source').querySelector('[value="mobile"]').remove();render();
</script></html>
